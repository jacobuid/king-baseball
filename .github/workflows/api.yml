name: API
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'infrastructure/pulumi/**', 'scripts/configure-deployment.mjs', 'package.json', 'package-lock.json', '.github/workflows/api.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update D1 infrastructure
        id: pulumi
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: prod
          work-dir: infrastructure/pulumi
          upsert: true
          config-map: |
            cloudflareAccountId:
              value: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            projectSlug:
              value: ${{ github.event.repository.name }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure D1 binding
        run: node scripts/configure-deployment.mjs
        env:
          D1_DATABASE_ID: ${{ steps.pulumi.outputs.databaseId }}
          PROJECT_SLUG: ${{ github.event.repository.name }}
          B2_BUCKET: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          WEB_ORIGIN: https://${{ github.repository_owner }}.github.io
      - run: npm run check -w services/api
      - run: npx wrangler d1 migrations apply DB --remote --config services/api/wrangler.jsonc
      - run: npm run deploy -w services/api
